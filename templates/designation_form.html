{% extends "base.html" %}

{% block content %}

<div class="container-fluid">

    <h2 class="mb-4">

        {% if designation %}
            Edit Designation
        {% else %}
            Add Designation
        {% endif %}

    </h2>


    <div class="card shadow-sm">

        <div class="card-body">

            <form method="POST">

                {% csrf_token %}

                <div class="mb-3">

                    <label class="form-label">
                        Designation Name
                    </label>

                    <input
                        type="text"
                        name="name"
                        class="form-control"
                        value="{{ designation.name|default:'' }}"
                        placeholder="Enter designation"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    Save
                </button>

                <a
                    href="{% url 'designation_list' %}"
                    class="btn btn-secondary"
                >
                    Cancel
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
